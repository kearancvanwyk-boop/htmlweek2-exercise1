<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <header>
        <h1>Our Products</h1>
        <p>Shop the latest products</p>
    </header>

    <main class="products-container">
        <!-- Product 1 -->
         <article class="card">
            <img src="https://picsum.photos/300/200?random=1" alt="Wireless Headphones">
            <h2>Wireless Headphones</h2>
            <p class="price">R 899.99</p>
            <button>Add to Cart</button>
         </article>

         <!-- Product 2 -->
          <article class="card">
            <img src="https://picsum.photos/300/200?random=2" alt="Smart Watch"
            <h2>Smart Watch</h2>
            <p class="price">R 1299.99</p>
            <button>Add to Cart</button>
          </article>
          
          <!-- Product 3 -->
           <article class="card">
            <img src="https://picsum.photos/300/200?random=3" alt="Sneakers"
            <h2>Running Sneakers</h2>
            <p class="price">R 749.99</p>
            <button>Add to Cart</button>
           </article>

           <!-- Product 4 -->
            <article class="card">
                <img src="https://picsum.photos/300/200?random=4" alt="Backpack">
                <h2>Travel Backpack</h2>
                <p class="price">R 499.99</p>
                <button>Add to Cart</button>
            </article>

            <!-- Product 5 -->
             <article class="card">
                <img src="https://picsum.photos/300/200?random=5" alt="Sunglasses">
                <h2>Sunglasses</h2>
                <p class="price">R 349.99</p>
                <button>Add to Cart</button>
             </article>

             <!-- Product 6 -->
              <article class="card">
                <img src="https://picsum.photos/300/200?random=6" alt="Water Bottle"
                <h2>Water Bottle</h2>
                <p class="price">R 199.99</p>
                <button>Add to Cart</button>
              </article>
        </main>
</body>
</html>
